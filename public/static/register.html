<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Register bruger</title>
    <link rel="stylesheet" href="../style.css">
    <script type="text/javascript" src="../register.js" defer></script>
</head>
<body >

<header class="top-header">
    <a href="/index.html" class="logo">
        <span class="logo-circles"></span>
        <span class="logo-text">DAMP</span>
    </a>

    <nav class="nav-links">
        <a href="/index.html" class="nav-link">Velkommen</a>
        <a href="/register.html" class="nav-link active">Opret bruger</a>
        <a href="/login.html" class="nav-link">Log ind</a>
    </nav>
</header>

<section class="auth-page">

    <main class="auth-card">
        <div class="auth-header">
            <div class="logo">
                <span class="logo-circles"></span>
                <span class="logo-text">DAMP</span>
            </div>
        </div>
        <p class="auth-details">Opret ny konto</p>


        <form class="auth-form">
            <div class="form-group">
                <label for="email">E-MAIL</label>
                <input type="text" id="email" name="email" placeholder="din@email.dk">
            </div>
            <div class="form-group">
                <label for="username">BRUGERNAVN</label>
                <input type="text" id="username" name="username" placeholder="Vælg et brugernavn">
            </div>
            <div class="form-group">
                <label for="password">ADGANGSKODE</label>
                <input type="password" id="password" name="password" placeholder="********">
            </div>
            <div class="form-group">
                <label for="password-repeat">GENTAG ADGANGSKODE</label>
                <input type="password" id="password-repeat" name="passwordRepeat" placeholder="********">
            </div>
            <button type="submit" class="btn btn-primary">Opret bruger</button>
        </form>
        <div class="auth-divider">eller</div>
        <div class="auth-footer">
            Har du allerede en konto? <a href="/login.html" class="link-subtle">Log ind</a>
        </div>
    </main>
</section>
</body>
</html>
