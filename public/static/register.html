<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Register bruger</title>
    <link rel="stylesheet" href="../style.css">
    <script type="text/javascript" src="../register.js" defer></script>
</head>
<body>
    <section class="register">
        <label for="email">E-MAIL</label>
        <input type="text" id="email" name="email" placeholder="din@email.dk">
        <label for="username">BRUGERNAVN</label>
        <input type="text" id="username" name="username" placeholder="Vælg et brugernavn">
        <label for="password">ADGANGSKODE</label>
        <input type="password" id="password" name="password" placeholder="********">
        <label for="password-repeat">GENTAG PASSWORD</label>
        <input type="password" id="password-repeat" name="password" placeholder="********">
        <button type="submit">Opret bruger</button>
        <p>Har du allerede en konto? <a href="login.html">Log ind</a></p>
    </section>
</body>
</html>
