
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAMP - GAME INFO</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="../../gameInfo.js" defer></script>
</head>
<body>

<header class="top-header">
    <a href="/" class="logo">
        <span class="logo-circles"></span>
        <span class="logo-text">DAMP</span>
    </a>

    <nav class="nav-links">
        <a href="/" class="nav-link">Bibliotek</a>
        <a href="/store/" class="nav-link">Store</a>
        <a href="#" class="nav-link">Profil</a>
        <button class="btn btn-secondary" id="logout-button">Log ud</button>
    </nav>
</header>

<main class="main-container">

    <a href="/store/" class="back-link">← Tilbage til butikken</a>

    <section class="game-details-container">

        <!-- Spillets billede -->
        <div class="game-image-container">
            <img
                    id="game-image"
                    class="game-detail-image"
                    src=""
                    alt="Spillets forsidebillede"
            >
        </div>

        <!-- Spillets info -->
        <div class="game-content">
            <div class="game-header">
                <h1 id="game-title">Game Title</h1>
            </div>
            <div class="game-description-container">
                <h2>Om spillet</h2>
                <p id="game-description">
                    Spilbeskrivelse her.
                </p>
            </div>
            <!-- Game metadata -->
            <div class="game-information">
                <div class="info-item">
                    <span class="info-label">Genre</span>
                    <span id="game-genre" class="info-value"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">Platform</span>
                    <span id="game-platform" class="info-value"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">Udgiver</span>
                    <span id="game-publisher" class="info-value"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">Udvikler</span>
                    <span id="game-developer" class="info-value"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">Udgivelsesdato</span>
                    <span id="game-release-date" class="info-value"></span>
                </div>
            </div>

            <!-- Købssektion -->
            <div class="purchase-section">
                <div class="purchase-price">
                    <span class="price-label">Pris</span>
                    <span id="game-price" class="price-value"></span>
                </div>
                <button id="buy-game-btn" class="btn btn-buy">
                    Køb
                </button>
            </div>
        </div>
    </section>
</main>
</body>
</html>
