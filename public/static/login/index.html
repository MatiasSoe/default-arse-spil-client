<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../style.css">
    <script type="text/javascript" src="../../login.js" defer></script>
</head>
<body>

<header class="top-header">
    <a href="/" class="logo">
        <span class="logo-circles"></span>
        <span class="logo-text">DAMP</span>
    </a>

    <nav class="nav-links">
        <a href="/" class="nav-link">Velkommen</a>
        <a href="/register/" class="nav-link">Opret bruger</a>
        <a href="/login/" class="nav-link active">Log ind</a>
    </nav>
</header>

<section class="auth-page">

    <main class="auth-card">
        <div class="auth-header">
            <div class="logo">
                <span class="logo-circles"></span>
                <span class="logo-text">DAMP</span>
            </div>
        </div>

        <form class="auth-form">
            <div class="form-group">
                <label for="email">E-MAIL</label>
                <input type="text" id="email" name="email" placeholder="din@email.dk">
            </div>
            <div class="form-group">
                <label for="password">ADGANGSKODE</label>
                <input type="password" id="password" name="password" placeholder="********">
            </div>
            <button type="submit" class="btn btn-primary">Log ind</button>
            <button type="button" onclick="window.location.href='register.html'" class="btn btn-secondary ">Opret bruger</button>
        </form>
    </main>
</section>
</body>
</html>
